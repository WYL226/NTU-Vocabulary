<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NTU Vocabulary</title>

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta name="mobile-web-app-capable" content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="default">

<meta
name="apple-mobile-web-app-title"
content="NTU VOC">

<meta
name="theme-color"
content="#ffffff">

<link
rel="apple-touch-icon"
href="icon.png">

<link
rel="icon"
href="icon.png">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{

    height:100%;

    overflow:hidden;

}

body{

    margin:0;

    width:100vw;

    height:100vh;
    height:100dvh;

    overflow:hidden;

    background:#ffffff;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

}

/*========================*/

#card{

    width:100%;

    height:100%;

    height:100dvh;

    display:flex;

    flex-direction:column;

    padding:

        max(14px,env(safe-area-inset-top))

        18px

        max(18px,env(safe-area-inset-bottom))

        18px;

}

/*========================*/

#topArea{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;

}

/*========================*/

#question{

    font-size:30px;

    font-weight:bold;

    color:#222;

    text-align:center;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:12px;

}

#questionType{

    text-align:center;

    color:#666;

    font-size:18px;

    margin-bottom:10px;

}

/*========================*/

#middleArea{

    flex:1;

}

/*========================*/

#answerInput{

    width:100%;

    height:52px;

    font-size:24px;

    text-align:center;

    border-radius:14px;

    border:2px solid #d7d7d7;

    outline:none;

    margin-bottom:6px;

}

#answerInput:focus{

    border-color:#7aa7ff;

}

/*========================*/

#errorMessage{

    margin-top:8px;

    color:#d60000;

    font-size:20px;

    text-align:center;

    min-height:24px;

}

#answerArea{

    margin-top:4px;

    color:#1d4ed8;

    font-size:20px;

    text-align:center;

    min-height:24px;

}

/*========================*/

#buttonArea{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-top:auto;

    padding-top:14px;

}

/*========================*/

#buttonArea button{

    height:42px;

    border:none;

    border-radius:12px;

    background:#ececec;

    color:#222;

    font-size:15px;

    font-weight:600;

}

#answerButton{

    border:none;

    border-radius:10px;

    background:#ececec;

    color:#444;

    font-size:13px;

    padding:6px 10px;

}

#buttonArea button:active{

    transform:scale(.97);

}

/*========================*/
/* 鍵盤彈出 */
/*========================*/

@media (max-height:600px){

    #question{

        font-size:24px;

        margin-bottom:16px;

    }

    #buttonArea button{

        height:42px;

        font-size:15px;

    }

}

</style>



</head>
<body>

<div id="card">

    <div id="topArea">

        <div id="progress"></div>

        <button id="answerButton">
            👁 答案
        </button>

    </div>

    <div id="questionType">
        Loading...
    </div>

    <div id="question">
        請稍候...
    </div>

    <input
        id="answerInput"
        type="text"
        placeholder="請輸入答案"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false">

    <div id="errorMessage"></div>

    <div id="answerArea"></div>

    <div id="buttonArea">

        <button id="prevButton">
            ⬅ 上一題
        </button>

        <button id="nextButton">
            送出
        </button>

        <button id="nextHistoryButton">
            下一題 ➡
        </button>

    </div>

</div>

<script src="app.js"></script>

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("service-worker.js")
    .then(()=>{
        console.log("Service Worker 已註冊");
    })
    .catch(error=>{
        console.log(error);
    });

}

</script>

</body>

</html>
