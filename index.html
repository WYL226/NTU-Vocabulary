<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NTU Vocabulary</title>

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta name="mobile-web-app-capable" content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="default">

<meta
name="apple-mobile-web-app-title"
content="NTU VOC">

<meta
name="theme-color"
content="#ffffff">

<link
rel="apple-touch-icon"
href="icon.png">

<link
rel="icon"
href="icon.png">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#f3f4f6;

    font-family:Arial,"Microsoft JhengHei",sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

#card{

    width:100%;

    max-width:420px;

    background:white;

    border-radius:24px;

    padding:28px;

    box-shadow:0 8px 30px rgba(0,0,0,.12);

}

#progress{

    font-size:15px;

    color:#888;

    margin-bottom:10px;

}

#questionType{

    font-size:20px;

    font-weight:bold;

    color:#555;

}

#question{

    margin-top:18px;

    font-size:38px;

    font-weight:bold;

    color:#222;

    word-break:break-word;

}

#answerInput{

    width:100%;

    margin-top:30px;

    padding:14px;

    font-size:28px;

    text-align:center;

    border-radius:12px;

    border:2px solid #d0d0d0;

}

#answerInput:focus{

    outline:none;

    border-color:#4f8ef7;

}

#errorMessage{

    color:red;

    height:30px;

    margin-top:10px;

    font-size:20px;

}

#answerArea{

    min-height:40px;

    margin-top:15px;

    color:#2563eb;

    font-size:24px;

    font-weight:bold;

}

#buttonArea{

    margin-top:30px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}

#buttonArea button{

    padding:14px;

    font-size:18px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

}

#buttonArea button:active{

    transform:scale(.97);

}

</style>


</head>

<body>

<div id="card">

    <div id="topArea">

        <div id="progress"></div>

        <div id="questionType"></div>

        <div id="question"></div>

    </div>

    <div id="middleArea">

        <input
            id="answerInput"
            type="text"
            placeholder="請輸入答案"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false">

        <div id="errorMessage"></div>

        <div id="answerArea"></div>

    </div>

    <div id="buttonArea">

        <button id="prevButton">

            ⬅ 上一題

        </button>

        <button id="nextButton">

            送出

        </button>

        <button id="nextHistoryButton">

            下一題 ➡

        </button>

        <button id="answerButton">

            👁 顯示答案

        </button>

    </div>

</div>

<script src="app.js"></script>

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("service-worker.js")

    .then(()=>{

        console.log("Service Worker 已註冊");

    })

    .catch(error=>{

        console.log(error);

    });

}

</script>

</body>

</html>
